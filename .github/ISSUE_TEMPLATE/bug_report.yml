name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities must be reported privately through
        **Security → Report a vulnerability**, not through this form.
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "hayate 0.8.x"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Python and runtime
      placeholder: "Python 3.14, CPython/ASGI or Cloudflare Workers"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest code and commands that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
